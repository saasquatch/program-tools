name: Mint Components Prerelease

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prerelease mode to run
        required: true
        default: enter
        type: choice
        options:
          - enter
          - continue
          - exit
      tag:
        description: npm dist-tag and prerelease identifier
        required: false
        default: next
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    name: Publish Mint Components Prerelease
    defaults:
      run:
        working-directory: packages/mint-components
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org

      - name: Install packages
        run: npm ci

      - name: Validate prerelease state
        run: |
          mode="${{ github.event.inputs.mode }}"

          if [[ "$mode" == "enter" && -f .changeset/pre.json ]]; then
            echo "Prerelease mode is already active. Use 'continue' or 'exit'."
            exit 1
          fi

          if [[ "$mode" != "enter" && ! -f .changeset/pre.json ]]; then
            echo "Prerelease mode is not active. Use 'enter' first."
            exit 1
          fi

      - name: Enter prerelease mode
        if: ${{ github.event.inputs.mode == 'enter' }}
        run: npx changeset pre enter "${{ github.event.inputs.tag }}"

      - name: Exit prerelease mode
        if: ${{ github.event.inputs.mode == 'exit' }}
        run: npx changeset pre exit

      - name: Version package
        run: npm run version

      - name: Build package
        run: npm run build

      - name: Publish package
        run: npm run release
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Capture package version
        id: package-version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Commit prerelease changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --short)" ]]; then
            git add -A .
            git commit -m "chore: prerelease @saasquatch/mint-components@${{ steps.package-version.outputs.version }}"
          fi

      - name: Push branch and tags
        run: git push origin HEAD:${{ github.ref_name }} --follow-tags
