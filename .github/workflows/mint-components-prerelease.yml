name: Mint Components Prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish under (e.g. next, beta)
        required: true
        default: next
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    name: Publish Mint Components Prerelease
    defaults:
      run:
        working-directory: packages/mint-components
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org

      - name: Install packages
        run: npm ci

      - name: Validate prerelease tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [[ "$tag" == "latest" ]]; then
            echo "Refusing to publish a prerelease under the 'latest' dist-tag. Choose a different tag (e.g. next, beta)."
            exit 1
          fi

      - name: Validate prerelease version
        id: package-version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Require SemVer prerelease form: x.y.z-<identifier>. Plain x.y.z is rejected.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "package.json version '$version' is not a prerelease. Expected SemVer prerelease form like x.y.z-a (e.g. 2.2.0-1, 2.2.0-beta.0). Bump the version manually before running this workflow."
            exit 1
          fi

          if git rev-parse "@saasquatch/mint-components@$version" >/dev/null 2>&1; then
            echo "Tag @saasquatch/mint-components@$version already exists. Bump the version manually."
            exit 1
          fi

      - name: Build package
        run: npm run build

      - name: Publish package
        run: npm publish --tag "${{ github.event.inputs.tag }}"
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Tag prerelease
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "@saasquatch/mint-components@${{ steps.package-version.outputs.version }}"
          git push origin "@saasquatch/mint-components@${{ steps.package-version.outputs.version }}"
