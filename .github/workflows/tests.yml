name: Unit Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        package:
          - component-boilerplate
          - express-boilerplate
          - integration-boilerplate-node
          - logger
          - mint-components
          - program-boilerplate
          - stencil-grapes-plugin

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 3d3c4 = v7.0.1

      - name: Use Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 82076 = v7.0.0
        with:
          node-version: 22.x

      - name: Install Dependencies
        id: install-deps
        working-directory: packages/${{ matrix.package }}
        run: |
          npm ci

      - name: Build
        id: build
        working-directory: packages/${{ matrix.package }}
        run: |
          npm run build --if-present

      - name: Run Tests
        id: run-tests
        working-directory: packages/${{ matrix.package }}
        run: |
          npm test
