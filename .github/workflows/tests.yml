name: Unit Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        package:
          - program-boilerplate
          - component-boilerplate
          - stencil-grapes-plugin
          - mint-components
          - integration-boilerplate-node
          - express-boilerplate

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # df4cb = v6.0.3

      - name: Use Node.js
        id: setup-node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 48b55 = v6.4.0
        with:
          node-version: 22.x

      - name: Install Dependencies
        id: install-deps
        working-directory: packages/${{ matrix.package }}
        run: |
          npm ci

      - name: Build
        id: build
        working-directory: packages/${{ matrix.package }}
        run: |
          npm run build --if-present

      - name: Run Tests
        id: run-tests
        working-directory: packages/${{ matrix.package }}
        run: |
          npm test
